      to_rule_found: true
      uncertain: false

- rule_id: R606
  manual: "DECODE Competition Manual (2025-2026 base)"
  section_path: ["12 Robot Construction Rules", "12.6 Power Distribution"]
  tier: rule
  effective_date: base-manual
  text: "*Batteries should be securely mounted. The ROBOT battery must be secured such that it will not dislodge during vigorous ROBOT interaction including if the ROBOT is turned over or placed in any arbitrary orientation. Batteries must be mounted such that they are protected from direct contact with other ROBOTS or any sharp edges."
  cross_refs: []

- rule_id: R607
  manual: "DECODE Competition Manual (2025-2026 base)"
  section_path: ["12 Robot Construction Rules", "12.6 Power Distribution"]
  tier: rule
  effective_date: base-manual
  text: "*Electrical connections should be robust and must be insulated. All electrical paths may include intermediate elements such as COTS connectors (Anderson Powerpole, XT30, and similar crimp or quick-connect style connectors), splices, COTS flexible/rolling/sliding contacts, and COTS slip rings, as long as the entire electrical pathway is via appropriately gauged/rated elements and all connections are protected from accidental electrical shorts. Teams are strongly encouraged to insulate all exposed electrical terminations or provide physical barricades to protect from accidental electrical shorts."
  cross_refs: []

- rule_id: R608
  manual: "DECODE Competition Manual (2025-2026 base)"
  section_path: ["12 Robot Construction Rules", "12.6 Power Distribution"]
  tier: rule
  effective_date: base-manual
  text: "*Limit non-battery energy. Non-electrical sources of energy used by the ROBOT (i.e., stored at the start of a MATCH) shall come only from the following sources: A. a change in the altitude of the ROBOT center of gravity, or B. storage achieved by deformation of ROBOT parts including, but not limited to, springs, rubber bands, surgical tubing, etc."
  cross_refs: []

- rule_id: R609
  manual: "DECODE Competition Manual (2025-2026 base)"
  section_path: ["12 Robot Construction Rules", "12.6 Power Distribution"]
  tier: rule
  effective_date: base-manual
  text: "*Connect the ROBOT battery though the Main Power Switch. Exactly one main power switch must control all power provided by the ROBOT battery pack to all power regulating devices on the ROBOT (except as specified by R602) such that all the following conditions are met: A. must be one of the following approved power switches: [see Table 12-5 for approved switches]. B. must be mounted or located where it is accessible to the team and FIELD STAFF. C. secondary power switches can be used on the 12V line downstream of the main power switch. There are no specific location requirements for the main power switch, but it should be located clear of any moving parts and other obstructions that would block its access during normal ROBOT operations. Examples considered not \"quickly and safely accessible\" include main power switches covered by an access panel or door, or mounted on, underneath or immediately adjacent to moving COMPONENTS. The main power switch should be mounted on the ROBOT, so it is protected from ROBOT-to-ROBOT contact to avoid inadvertent actuation or damage."
  cross_refs:
    - to_rule: R602
      cite_text: "except as specified by R602"
      to_rule_found: true
      uncertain: false

- rule_id: R610
  manual: "DECODE Competition Manual (2025-2026 base)"
  section_path: ["12 Robot Construction Rules", "12.6 Power Distribution"]
  tier: rule
  effective_date: base-manual
  text: "*Fuse ratings should not be altered. Fuses must not be replaced with fuses of higher rating than originally installed or according to manufacturer's specifications; fuses may not be shorted out. Fuses must not exceed the rating of those closer to the battery. If necessary, a fuse may be replaced with a smaller rating. Replaceable fuses must be single use only; self-resetting fuses (breakers) are not allowed."
  cross_refs: []

- rule_id: R611
  manual: "DECODE Competition Manual (2025-2026 base)"
  section_path: ["12 Robot Construction Rules", "12.6 Power Distribution"]
  tier: rule
  effective_date: base-manual
  text: "*The ROBOT frame is not a wire. All wiring and electrical devices shall be electrically isolated from the ROBOT frame. The ROBOT frame must not be used to carry electrical current. Electrically grounding the control system electronics to the frame of the ROBOT is only permitted such that all of the following conditions are met: A. straps/cables used must be from the following approved parts: [see Table 12-6 for approved grounding straps]. B. the strap/cable must directly connect to a fully COTS COMPONENT with an XT30 connector, and also must connect directly to the frame of the ROBOT (via the resistive terminal), and C. no ROBOT COMPONENTS or MECHANISMS are designed to electrically ground the ROBOT frame to the FIELD. Compliance with this rule can be checked by unplugging the battery from the ROBOT main power switch assembly and observing a >120Ω resistance between the (+ / red) input terminal of the ROBOT main power switch assembly in the \"ON\" position or the (- / black) input terminal of the ROBOT main power switch assembly and any electrically connected point on the ROBOT. Most aluminum has a clear anodizing layer or oxidation layer on it that acts as an insulator. In order to make a good electrical connection with the grounding strap to the frame, it may be necessary to scratch/file/remove the anodize/oxidation layer from the area of contact with the metal first. Note that some cameras, decorative lights, and sensors (some encoders, some IR sensors, etc.) have grounded enclosures or are manufactured with conductive plastics. These devices must be electrically isolated from the ROBOT frame to ensure compliance with this rule. Examples of devices with COTS XT30 connectors include but are not limited to the REV Control Hub (REV-31-1595), a COTS XT30 power distribution block (such as a REV-31-1293), or a COTS Anderson Powerpole to XT30 Adapter (such as REV-31-1385). For additional details on installation of the grounding strap, please see the ROBOT Wiring Guide."
  cross_refs: []

- rule_id: R612
  manual: "DECODE Competition Manual (2025-2026 base)"
  section_path: ["12 Robot Construction Rules", "12.6 Power Distribution"]
  tier: rule
  effective_date: base-manual
  text: "*Electrical system must be inspectable. All power regulating devices (per R505), associated wiring, and all fuses must be visible for inspection. \"Visible for inspection\" does not require that the items be visible when the ROBOT is in STARTING CONFIGURATION, provided the team can make the items viewable during the inspection process."
  cross_refs:
    - to_rule: R505
      cite_text: "All power regulating devices (per R505)"
      to_rule_found: false
      uncertain: false

- rule_id: R613
  manual: "DECODE Competition Manual (2025-2026 base)"
  section_path: ["12 Robot Construction Rules", "12.6 Power Distribution"]
  tier: rule
  effective_date: base-manual
  text: "*No high voltage allowed except for LEDs. Any active electrical item that is not an actuator (specified in R501) or power regulation device (specified in R505) is considered a CUSTOM CIRCUIT. CUSTOM CIRCUITS shall not provide regulated output voltages exceeding 5V, except if solely used for powering LEDs, but may pass through unregulated battery voltage."
