      to_rule_found: true
      uncertain: false
    - to_rule: R505
      cite_text: "except those allowed by R505"
      to_rule_found: false
      uncertain: false

- rule_id: R619
  manual: "DECODE Competition Manual (2025-2026 base)"
  section_path: ["12 Robot Construction Rules", "12.6 Power Distribution"]
  tier: rule
  effective_date: base-manual
  text: "*Do not mix and match power on or between power regulation devices. The following rules must be adhered to when using power on any power regulation device (per R505): A. other than power used to energize the power regulation device (per R614) no power originating outside the power regulation device may be used on or with devices connected to the power regulation device. The only exceptions are connections intended for communication between devices (RS485/USB/PWM/etc.), Example 1: The +5V port on a REV Expansion Hub cannot be used to power devices connected to a REV Control Hub's I2C ports. Example 2: A regulated 5V output provided by a CUSTOM CIRCUIT cannot be used to power an I2C device connected to a REV Control Hub. B. power originating from ports/connectors on power regulation devices may only be used for devices directly connected to that port/connector. The only exception to this is +5V power from the +5V power port on the REV Control Hub or REV Expansion Hub may be used in conjunction with any Analog, Digital, or I2C port on that device. In addition, the +5V power port may be used to power external devices, and Example 1: The power provided by Digital Port 0-1 on a REV Control Hub should not be used to power devices connected to I2C Port 0. However, power provided by Digital Port 0-1 can be used to power devices connected to both signal channels N and N+1 on Digital Port 0-1. Example 2: The +5V power can be used to power external devices such as externally powered USB hubs (per R617). Example 3: The power provided by multiple servo ports cannot be combined into a single power bus for one or more servos. C. 6V power provided by the goBILDA 6V Servo Power Injector, REV Servo Power Module, REV Robotics Servo Hub, or Studica Servo Power Block may only be used for powering servos."
  cross_refs:
    - to_rule: R505
      cite_text: "when using power on any power regulation device (per R505)"
      to_rule_found: false
      uncertain: false
    - to_rule: R614
      cite_text: "other than power used to energize the power regulation device (per R614)"
      to_rule_found: true
      uncertain: false
    - to_rule: R617
      cite_text: "externally powered USB hubs (per R617)"
      to_rule_found: true
      uncertain: false
