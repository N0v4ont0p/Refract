- rule_id: R615
  manual: "DECODE Competition Manual (2025-2026 base)"
  section_path: ["12 Robot Construction Rules", "12.6 Power Distribution"]
  tier: rule
  effective_date: base-manual
  text: "*Use appropriately sized wire. All circuits shall be wired with appropriately sized insulated copper wire (SIGNAL LEVEL cables do not have to be copper): [see Table 12-8 for Wire sizing requirements including: 12V Main Battery Power minimum 18 AWG; Motor Power 11-20A fuse protected circuit minimum 16 AWG; Motor Power for TETRIX MAX 12V DC Motors and REV Robotics Core Hex minimum 22 AWG; PWM/Servo and LEDs minimum 14 AWG; SIGNAL LEVEL circuits minimum 28 AWG]. Integrated wires originally attached to legal COTS devices or wires included/sold by the manufacturer are considered part of the device and by default legal. Such wires are exempt from this rule. In order to show compliance with these rules, teams should use wire with clearly labeled sizes if possible. If unlabeled wiring is used, teams should be prepared to demonstrate that the wire used meets the requirements of this rule (e.g., wire samples and evidence that they are the required size). Combining multiple smaller wires in parallel cannot be used to create an equivalent larger wire which meets minimum wire cross section requirements."
  cross_refs: []

- rule_id: R616
  manual: "DECODE Competition Manual (2025-2026 base)"
  section_path: ["12 Robot Construction Rules", "12.6 Power Distribution"]
  tier: rule
  effective_date: base-manual
  text: "*Use specified wire colors. All non-SIGNAL LEVEL wiring with a constant polarity (i.e., except for outputs of motor controllers, or sensors) shall be color-coded along their entire length from the manufacturer as follows: A. red, yellow, white, brown, or black-with-stripe on the positive (e.g., +12VDC, +5VDC) connections, and B. black or blue for the common or negative side (-) of the connections. Exceptions to this rule include: C. wires that are originally attached to legal devices and any extensions to these wires using the same color as the manufacturer. Multi-conductor (also known as multi-core) cables that do not adhere to the specified color-coding may be used, on the condition that the insulation of all exposed conductors is re-identified to comply with the rule. This can be achieved by applying colored electrical tape, colored heat shrink, or another compliant method to distinguish each conductor."
  cross_refs: []

- rule_id: R617
  manual: "DECODE Competition Manual (2025-2026 base)"
  section_path: ["12 Robot Construction Rules", "12.6 Power Distribution"]
  tier: rule
  effective_date: base-manual
  text: "*Powered USB hubs must draw energy from approved sources. Powered USB hubs used on the ROBOT can only be powered through one of the following ways: A. an approved COTS USB battery Pack per R602, or B. the 5V auxiliary power port on the REV Expansion Hub or REV Control Hub."
  cross_refs:
    - to_rule: R602
      cite_text: "an approved COTS USB battery Pack per R602"
      to_rule_found: true
      uncertain: false

- rule_id: R618
  manual: "DECODE Competition Manual (2025-2026 base)"
  section_path: ["12 Robot Construction Rules", "12.6 Power Distribution"]
  tier: rule
  effective_date: base-manual
  text: "*Do not modify critical power paths. CUSTOM CIRCUITS shall not directly alter the power or control pathways between: A. the ROBOT battery and main power switch, B. the main power switch and a power regulating device (per R609), C. any two power regulating devices (per R613), or D. power regulating devices and actuators. Custom high impedance voltage monitoring or low impedance current monitoring circuitry connected to the ROBOT'S electrical system is acceptable if the effect on power pathways is inconsequential. Altering a power pathway includes, but is not limited to, altering the voltage of the power pathway using a boost (DC voltage step-up) or buck (DC voltage step-down) converter or otherwise altering the natural variable DC voltage provided by the ROBOT battery to create a constant DC voltage. Devices that modify actuator control signals or power (except those allowed by R505) are prohibited, such as the goBILDA Servo Travel Tuner."
  cross_refs:
    - to_rule: R609
      cite_text: "the main power switch and a power regulating device (per R609)"
      to_rule_found: true
      uncertain: false
    - to_rule: R613
