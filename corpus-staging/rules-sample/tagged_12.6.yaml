  manual: "DECODE Competition Manual (2025-2026 base)"
  section_path: ["12 Robot Construction Rules", "12.6 Power Distribution"]
  tier: rule
  effective_date: base-manual
  text: "*Energize Power Regulating Devices as specified. All power regulating devices (R505) must be powered per the manufacturer's instructions and the following table must be true: [see Table 12-7 for Power Regulation Device Power Requirements with specific part numbers and powering methods for goBILDA 6V Servo Power Injector, REV Control Hub / REV Expansion Hub, REV Servo Power Module, REV Robotics Servo Hub, REV SPARKmini, and Studica Servo Power Block]."
  cross_refs:
