- rule_id: R601
  manual: "DECODE Competition Manual (2025-2026 base)"
  section_path: ["12 Robot Construction Rules", "12.6 Power Distribution"]
  tier: rule
  effective_date: base-manual
  text: "*Battery limit – everyone has the same main ROBOT power. The only legal source of electrical energy for the ROBOT control system and actuation during the competition, the ROBOT battery, must be 1 and only 1 approved 12V NiMH main battery. The ROBOT main battery must have a COTS equivalent in-line 20A ATM mini blade fuse installed. Installed connectors may be replaced with other popular connectors such as Anderson Powerpole, XT30, or any connector with a comparable power rating. The only allowed ROBOT main power battery packs are: [see Table 12-4 for approved battery part numbers]. There are many other similar style batteries available from multiple VENDORS, but only the listed manufactures and part numbers are legal for use at FIRST Tech Challenge Events. Batteries should be charged in accordance with manufacturer's specification. (Please see the FIRST Safety Manual for additional information.)"
  cross_refs: []

- rule_id: R602
  manual: "DECODE Competition Manual (2025-2026 base)"
  section_path: ["12 Robot Construction Rules", "12.6 Power Distribution"]
  tier: rule
  effective_date: base-manual
  text: "*Other batteries are only allowed for peripheral devices and LEDs only. COTS USB battery packs with a capacity of 100Wh or less (27,000mAh at 3.7V), with 5V/5A max output or 12V/5A max output using USB-PD per port, and batteries integral to a self-contained camera (e.g., GoPro style camera) may be used provided they are: A. connected only using unmodified COTS cables, B. charged according to manufacturer recommendations, C. securely fastened to the ROBOT, D. not supplement power to any of the ROBOT actuators, and E. not used by any devices receiving control signals from the ROBOT control system (i.e., COTS USB battery packs must remain electrically isolated from the ROBOT power systems.). Exceptions to part E of this rule are: i. powered USB Hubs, and ii. ROBOT CONTROLLER smartphones. For example, a REV Blinkin powered by a COTS USB battery pack cannot be controlled by signals from a REV Control or Expansion Hub. Any device receiving signals from a REV Control or Expansion Hub must be powered by the main ROBOT battery."
  cross_refs: []

- rule_id: R603
  manual: "DECODE Competition Manual (2025-2026 base)"
  section_path: ["12 Robot Construction Rules", "12.6 Power Distribution"]
  tier: rule
  effective_date: base-manual
  text: "*Charge batteries with safe connectors. Any battery charger used to charge a ROBOT battery must have a corresponding polarized connector installed. Batteries must never be charged using alligator clips or similar."
  cross_refs: []

- rule_id: R604
  manual: "DECODE Competition Manual (2025-2026 base)"
  section_path: ["12 Robot Construction Rules", "12.6 Power Distribution"]
  tier: rule
  effective_date: base-manual
  text: "*Charge batteries at a safe rate. Any battery charger used to charge a ROBOT battery may not be used such that it exceeds a 3-amp average charge current. Follow all manufacturer recommendations when charging batteries."
  cross_refs: []

- rule_id: R605
  manual: "DECODE Competition Manual (2025-2026 base)"
  section_path: ["12 Robot Construction Rules", "12.6 Power Distribution"]
  tier: rule
  effective_date: base-manual
  text: "*Batteries are not ballast. No batteries other than those allowed per R601 and R602 are allowed on the ROBOT, whether or not they are being used to supply power. For example, teams may not use additional batteries as extra weight on their ROBOTS."
  cross_refs:
