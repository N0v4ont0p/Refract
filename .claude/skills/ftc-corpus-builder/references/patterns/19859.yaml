  - id: 19859-G-turret-soft-limit-return-to-center
    finding_ref: []
    problem: >
      A turret with a limited mechanical rotation range must not be commanded past its physical
      limits when the computed aim solution falls outside a safe range.
    solution_approach: >
      If the computed target turret angle falls outside [TURRET_MIN_SAFE_ANGLE,
      TURRET_MAX_SAFE_ANGLE], the aim update clears hasTarget/isAimLocked, drives the turret back
      toward a configured TURRET_CENTER_ANGLE instead of the unsafe target, and resets the hood to
      its minimum position — a fail-safe default rather than clamping the angle in place.
    code_reference: { file: "subsystems/AutoAimSubsystem.java", lines: "353-360" }
    applicable_when: "turret.present == true && turret.has_mechanical_range_limit == true"
    source_team: "19859"
    confidence: single-source
    provenance:
      classification: independently-derived
      basis: "Team's own safety branch inside its own turret-aim update loop — the choice to recenter rather than saturate-at-limit is a deliberate design decision."
      collapses_with: []
    caveat_ref: "known-imperfect-autoaim"
    notes: >
      Same fielded-vs-rough tension as 19859-F applies (lives inside the same AutoAimSubsystem,
      only exercised from tests/) — see 19859-F's notes for the full both-sides record. The
      recenter-not-clamp design decision itself is sound regardless of that tension; use as a
      reference for the safety-behavior CHOICE, not as confirmation the whole subsystem is
      match-proven.
    recheck_trigger: >
      Same trigger as 19859-F: if remote branch access to 19859's repo becomes available later,
      re-check for an AutoAimSubsystem caller outside this snapshot and revisit this pattern's
      confidence/caveat explicitly rather than folding the result in passively.

  - id: 19859-H-pedro-follower-subsystem-wrapper
    finding_ref: []
    problem: >
      Integrate Pedro Pathing's Follower into an FTCLib command-based architecture so
      path-following can be driven/queried like any other subsystem, with pose pushed to a
      dashboard each tick.
    solution_approach: >
      FollowerSubsystem extends FTCLib's SubsystemBase, constructs the Follower via
      pedroPathing/Constants.createFollower, exposes a thin pass-through API. Its periodic() calls
      follower.update() and pushes x/y/heading to a TelemetryManager every scheduler tick.
    code_reference: { file: "subsystems/FollowerSubsystem.java", lines: "14-75" }
    applicable_when: "software_stack.pathing == pedro_pathing && software_stack.command_framework == ftclib"
    source_team: "19859"
    confidence: low
    provenance:
      classification: shared-ancestry
      basis: "Standard FTCLib+Pedro integration glue every team using both libraries writes — convergent boilerplate following both libraries' own idioms, not a team-original design."
      collapses_with: ["FTCLib SubsystemBase + Pedro Follower integration idiom"]
    notes: >
      No known-imperfect caveat applies (unrelated to the flagged areas) — the low tag is purely
      provenance/novelty. Real latent bug worth preserving: getInstance() reassigns a NEW instance
      on every call (instance = new FollowerSubsystem(...)) — a broken singleton, no actual reuse.
      This argues against citing the file as an exemplary singleton pattern even though the
      wrapping SEAM (Pedro Follower as an FTCLib SubsystemBase) is a reasonable structural choice.

  - id: 19859-I-dynamic-bezier-command-by-point-count
    finding_ref: []
    problem: >
      Drive from the robot's CURRENT (live, not pre-planned) pose to a target pose through a
      variable number of control points, as a single composable command.
    solution_approach: >
      DriveCurrentToPoint (and sibling DrivePointToPoint) extend FTCLib's CommandBase, overloaded by
      Bezier control-point count (2-5), selected at construction. The Pedro PathBuilder path is
      built inside initialize() — not the constructor — using the follower's LIVE pose at
      schedule-time. DrivePointToPoint is the same structure from an explicit start pose instead.
    code_reference: { file: "commands/DriveCurrentToPoint.java", lines: "11-124" }
    applicable_when: "software_stack.pathing == pedro_pathing && software_stack.command_framework == ftclib"
    source_team: "19859"
    confidence: single-source
    provenance:
      classification: independently-derived
      basis: "Bezier/PathBuilder are Pedro primitives and CommandBase is FTCLib, but the load-bearing idea — resolving the path start from the robot's live pose at initialize() rather than at construction — is the team's own design. The deliberate live-pose-vs-fixed-start contrast between the two sibling commands confirms intentionality, not incidental behavior."
      collapses_with: []
    notes: >
      Full confidence — unrelated to the three flagged areas (autoaim/shooter/Pinpoint). Real design
      insight (resolve the path start at runtime so it begins wherever the robot actually is).

  - id: 19859-J-hybrid-command-plus-raw-loop-orchestration
    finding_ref: []
    problem: >
      An autonomous routine needs both DISCRETE sequenced actions and CONTINUOUS per-tick concerns
      (pose tracking, dashboard drawing, live distance-based shooter aiming) running simultaneously.
    solution_approach: >
      Built on the raw event-driven OpMode base (not LinearOpMode): discrete sequencing goes through
      FTCLib's CommandScheduler, scheduled once in start(). Continuous concerns run directly every
      tick in the OpMode's own loop(), OUTSIDE the command graph, alongside
      CommandScheduler.getInstance().run().
    code_reference: { file: "auto/BLUE_FAR_LEAVE.java", loop: "75-93", start: "95-123" }
    applicable_when: "software_stack.command_framework == ftclib && software_stack.opmode_base == raw_opmode"
    source_team: "19859"
    confidence: single-source
    provenance:
      classification: independently-derived
      basis: "The CommandScheduler.getInstance().run() call inside a raw OpMode.loop() is a standard FTCLib usage — the shared part. The team-specific part is the deliberate architectural split between scheduled discrete sequencing and raw-loop continuous concerns."
      collapses_with: []
    notes: >
      Full confidence — unrelated to the three flagged areas. Structurally similar auto opmodes
      exist for other alliance/start-position combinations (BLUE_CLOSE_18, BLUE_FAR_21, RED_CLOSE_18,
      RED_FAR_21) — cited file is representative, not exhaustive.

