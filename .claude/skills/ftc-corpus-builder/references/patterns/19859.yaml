  - id: 19859-A-pinpoint-crc-firmware-gate
    finding_ref: []
    problem: >
      goBILDA Pinpoint's CRC error-detection mode is only available on newer driver firmware;
      blindly enabling it on older firmware would silently fail or misbehave. Need graceful
      degradation plus visibility into odometry-sensor health.
    solution_approach: >
      At init, read pinPoint.getDeviceVersion() and only enable ErrorDetectionType.CRC if firmware
      >= a minimum-version constant (PINPOINT_CRC_MIN_FIRMWARE_VERSION = 3); otherwise fall back to
      ErrorDetectionType.LOCAL_TEST. Tracks last DeviceStatus and a bad-read counter, exposed via
      getters.
    code_reference: { file: "subsystems/Drivetrain.java", init: "39-62", gate: "64-74", status_tracker: "76-82", getters: "215-229" }
    applicable_when: "odometry.type == gobilda_pinpoint"
    source_team: "19859"
    confidence: single-source
    provenance:
      classification: independently-derived
      basis: "Team's own commit (5dd70eb, 'Add intake heading lock and Pinpoint CRC telemetry'); no shared-library import for this logic — direct GoBildaPinpointDriver SDK calls."
      collapses_with: []
    caveat_ref: "known-imperfect-pinpoint"
    notes: >
      KNOWN-IMPERFECT (per author, 2026-07-16): the team confirms Pinpoint integration overall has
      "a bit of deviation" — not fully dialed in. The specific technical question (whether the
      private updatePinPoint() that updates the bad-read counter still has a live call site — it
      appeared to have none in this snapshot) was NOT resolved either way. Use this as a design
      REFERENCE for the firmware-gating strategy, not a best-practice exemplar to cite as proven.

  - id: 19859-B-pd-heading-lock-field-oriented
    finding_ref: []
    problem: >
      Hold a target field-relative heading while still allowing full translational driver control
      in a field-oriented mecanum drive, without a blocking turn-to-heading routine.
    solution_approach: >
      driveFieldOriented(gamepad, lockHeading, targetHeadingDeg, p, currentPosition): when
      lockHeading is true, `turn` is computed by calculateHeadingCorrection instead of the right
      stick. Wraps heading error to [-180,180], deadbands under 1 deg, applies a dt-based PD
      (AUTO_TURN_KP/AUTO_TURN_KD) whose output passes through a signum-based kS feedforward blend
      (recalcTurn).
    code_reference: { file: "subsystems/Drivetrain.java", overloads: "108-110,160-182", correction: "184-205", feedforward: "207-209" }
    applicable_when: "drivetrain.type == mecanum && localization.provides_heading == true"
    source_team: "19859"
    confidence: low
    provenance:
      classification: shared-ancestry
      basis: "Core is the widely-taught community mecanum field-oriented-control + PD heading-lock formulation (GM0-style) — convergent, not an independent invention. Only the recalcTurn kS feedforward term is genuinely team-specific."
      collapses_with: ["GM0/community mecanum field-oriented + textbook PD heading-lock"]
    notes: >
      No known-imperfect caveat applies here (unrelated to the Pinpoint/shooter/autoaim areas
      flagged 2026-07-16) — the low confidence tag is purely a provenance/novelty call, not an
      execution-quality one. An older, duplicate 3-arg overload also exists (Drivetrain.java:116-158,
      still called from tests/AASSTEST.java) — whether it's a deliberate comparison or unmigrated
      leftover is UNRESOLVED (author confirmed no information available).

  - id: 19859-C-shooter-empirical-cubic-fit
    finding_ref: [shooter-empirical-vs-physics]
    problem: >
      Produce flywheel-velocity, hood-position, intake-power, and inter-shot-gap setpoints for a
      variable-distance turreted shooter from measured calibration data.
    solution_approach: >
      A single generic cubic-polynomial evaluator f(a,b,c,d,x) = a*x^3+b*x^2+c*x+d, fit against
      distance with per-curve coefficient sets (velocity, hood — each effectively lower-order since
      leading coefficients are 0), reused across FOUR distinct empirical curves rather than
      hand-rolling a fit function per behavior.
    code_reference: { file: "subsystems/Shooter.java", constants: "39-61", fit_fn: "211-213", velocity: "247-253", hood: "255-261", intake_and_gap: "202-209" }
    applicable_when: "season.has_variable_distance_scoring == true"
    source_team: "19859"
    confidence: single-source
    provenance:
      classification: independently-derived
      basis: "The evaluator itself is a trivial shared primitive (cubic poly), but the fitted coefficients are 19859's own measured velocity/hood/intake/gap-vs-distance regression on their own robot, and the reuse-across-four-curves design is the team's own code-organization choice."
      collapses_with: []
    caveat_ref: "known-imperfect-shooter"
    notes: >
      KNOWN-IMPERFECT (per author, 2026-07-16): the same "known deviation, not the best code" signal
      the team gave for Pinpoint applies to the shooter area generally (this pattern was originally
      drafted as two candidates, C and E — merged here since they're one lineage: E was just "reuse
      the same evaluator across more curves," not a second independent finding). Use as a design
      REFERENCE for the shared-evaluator strategy, not a best-practice exemplar of dialed-in tuning.
      Separately: constants/panelConstants.java's class comment reads "未测试 未使用" (untested,
      unused), yet SHOOTER_KP/KI/KD/KF and VELOCITY_TOR from that class ARE imported and used live
      in this file's velocity-PIDF/shooterReady logic — whether the comment is stale or applies only
      to the class's other fields is UNRESOLVED (author confirmed no information available beyond
