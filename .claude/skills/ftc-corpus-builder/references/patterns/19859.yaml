  - id: 19859-F-sotm-braking-predictive-projection
    finding_ref: [moving-shot-compensation]
    problem: >
      Lead a turreted shot to compensate for robot translational motion AND anticipated
      deceleration (braking) between the aiming calculation and the moment the shot releases.
    solution_approach: >
      Chassis forward/lateral velocity and acceleration are low-pass filtered; if braking, measured
      acceleration is blended toward a fixed empirical brake-deceleration constant per axis. The
      release point/velocity is projected forward by MECHANICAL_SHOOT_DELAY, then flight time (from
      calculateAirtime, see 19859-D) projects the shot's landing position, converted to a target
      turret angle/rpm/pitch. Turret drive is a position PID plus kV/kS/kA feedforward, additionally
      offset by a braking-distance term.
    code_reference: { file: "subsystems/AutoAimSubsystem.java", braking_helpers: "224-240", chassis_filters_and_projection: "275-317", turret_brake_overshoot: "364-371", turret_feedforward_drive: "452-472" }
    applicable_when: "shooter.requires includes shoot_on_the_move && turret.present == true"
    source_team: "19859"
    confidence: single-source
    provenance:
      classification: independently-derived
      basis: "Only the inner turret loop is a shared primitive (FTCLib PIDFController). The filtering/braking-prediction/projection/feedforward strategy is bespoke. Pedro's own PredictiveBrakingCoefficients is for PATH following, not for leading a turret shot — a distinct, team-authored SOTM model, not adapted from a shared source."
      collapses_with: []
    caveat_ref: "known-imperfect-autoaim"
    notes: >
      KNOWN TENSION (per author, 2026-07-16) — NOT resolved either way, both sides recorded: the
      author describes AutoAimSubsystem as "a working (if rough) part of the robot," while the code
      itself shows it referenced only from tests/AASSTEST.java and tests/TurretFullAutoTuner.java —
      no auto/ or teleop opmode constructs it; the fielded teleop uses a simpler turretToDegree()
