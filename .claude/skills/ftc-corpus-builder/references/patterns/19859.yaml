      basis: "The ubiquitous FTC community auto->teleop static-field pose handoff idiom — convergent, not team invention."
      collapses_with: ["common FTC auto->teleop static-field pose handoff idiom"]
    notes: >
      No known-imperfect caveat applies (unrelated to the flagged areas) — low tag is purely
