  drive_back_left:   {value: "leftRear", source: asked, confirmed: true}
  drive_front_right: {value: "rightFront", source: asked, confirmed: true}
  drive_back_right:  {value: "rightRear", source: asked, confirmed: true}
  odometry_pinpoint: {value: "pinpoint", source: asked, confirmed: true}
