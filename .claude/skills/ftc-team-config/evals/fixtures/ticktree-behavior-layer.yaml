# G4/I3 fixture — the first config that actually SELECTS TickTree as a behavior layer.
#
# Phase G3 verified TickTree was WIRED (axis exists, detector fires, SKILL.md grounds against the
# docs). It was never verified as WORKING: no config had ever selected it, so ftc-construct had
# never once been run against `behavior_layer: ticktree` end to end. This fixture exists to make
# that test real, at the same standard Phase B's utilization audit applied to Pedro/FTCLib/RoadRunner.
#
# Deliberately NOT a copy of 19859's config: this team is `untuned`, so the same run also exercises
# the Phase H untuned-scaffold path (emit_tuning render -> Double.NaN + procedure, never a number)
# rather than only the carry-forward-verbatim path a fully-tuned config takes.
_meta: {schema: 1, updated: 2026-08-06, suite_generated_code: true}
team: {number: 99999, experience: veteran}
drivetrain:
  type: {value: mecanum, source: asked, confirmed: true}
  mecanum:
    wheel_source: {value: goBILDA_stock, source: asked, confirmed: true}
    wheel_diameter_mm: {value: 104, source: asked, confirmed: true}
control_hardware:
  hub_generation: {value: REV_Control_Hub, source: inferred, confirmed: true}
  expansion_hub_count: {value: 1, source: asked, confirmed: true}
sensing:
  vision: {value: none, source: asked, confirmed: true}
  odometry: {value: goBILDA_pinpoint, source: asked, confirmed: true}
software_stack:
  pathing: {value: pedro_pathing, source: asked, confirmed: true}
  opmode_style: {value: ftclib_command_based, source: asked, confirmed: true}
  behavior_layer: {value: ticktree, source: asked, confirmed: true}
  # Asked, not detected — the team said yes to the pre-alpha caveat at the orchestration question.
  # This is the axis under test: TickTree composes ABOVE ftclib_command_based, it does not replace it.
fabrication:
  capability: {value: stock_gobilda_rev, source: asked, confirmed: true}
team_context:
  experience: {value: veteran, source: asked, confirmed: true}
