      collapses_with: []
    maturity_note: "The 127-bump multi-season cadence is strong MATURITY evidence of a real maintained framework — that is the point of this entry, kept separate from any design claim."
    notes: >
      KEEP-AS-META (not a droppable-in design pattern). The entry documents the specific
