  - id: 3543-J-observability-discipline
    layer: framework
    problem: >
      Keep live-tunable params from drifting away from the compiled source-of-truth, and
      make intermittent faults diagnosable after the fact.
    solution_approach: >
      (a) ORGANIZATION: one nested @Config class PER subsystem, each field initialized
      FROM the compiled default (e.g. baseParams = DriveBase.DecodeRobotInfo.baseParams,
      shootMotor1Pid = Shooter.shootMotor1PidParams) so the tunable MIRRORS rather than
      duplicates the source of truth. (b) DISCIPLINE: real per-match trace logging
      (useTraceLog, LOG_FOLDER_PATH, per-match filePrefix opened in robotInit) producing
      an actual TraceLogs/ directory of per-event Auto/TeleOp logs from named competitions.
    code_reference: { file: "teamcode/Dashboard.java", lines: "43-99", plus: "teamcode/FtcAuto.java:186-192 (TraceLog setup); TeamCode/src/main/TraceLogs/ (per-match logs)" }
    applicable_when: "software_stack.telemetry == ftc_dashboard && architecture.observability == mirrored_tunables_plus_per_match_tracelogs"
    source_team: "3543"
    confidence: medium-high
    provenance:
      classification: independently-derived
      basis: "The per-subsystem mirroring organization + per-match TraceLog discipline is Titan's own structuring around the borrowed @Config surface — stands on its own merit, separable from the mechanism (which is 3543-I)."
      collapses_with: []
    related:
      - { id: 3543-I-config-dashboard-usage, why: "the borrowed @Config mechanism this discipline is built on top of" }
    maturity_note: "Reflects a mature framework's tuning discipline; maturity held separate from the design-validation this tag rests on."
    notes: "STRONG observability signal (Phase 9 taxonomy positive) — the compiled-default MIRRORING (not duplicating) + real competition TraceLogs are the transferable practice, tagged medium-high on its own merit (NOT inheriting 3543-I's shared-ancestry cap)."

