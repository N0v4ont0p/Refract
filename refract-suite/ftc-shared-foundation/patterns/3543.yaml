      basis: "Titan's own convention across FRC/FTC templates (repo bootstrapped from trc492 FtcTemplate). The final-boolean master-switch idiom + dev-safety rationale + competition-coupled dashboard flag is a distinctive design choice, not a quickstart artifact."
      collapses_with: []
    maturity_note: "Convention carried across many Titan seasons/templates — continuity is maturity evidence, held separate from design validation; not promoted on template reuse."
    notes: "Flag NAMES (useSpindexer/useShooter/useAutoShoot…) are season-specific; the master-switch config PATTERN (final-boolean gates before subsystem construction, dev-safety, competition-coupled dashboard flag) is the core item. Second STANDALONE high."

