  - id: 3543-M-taskautoshoot
    layer: season_app
    problem: >
      Combine vision tracking, a shooting-solution model, multi-artifact sequencing, and
      motif logic into one resumable, cancelable auto-assist usable from Auto and TeleOp.
    solution_approach: >
      TaskAutoShoot extends TrcAutoTask<State> with a season State enum (START, DO_VISION,
      AIM, SHOOT, SHOOT_NEXT, NEXT_EXIT_SLOT, DONE) and a builder-style TaskParams inner
      class (fluent setters + an inAuto flag) parameterizing ONE reusable task for Auto vs TeleOp.
    code_reference: { file: "teamcode/autotasks/TaskAutoShoot.java", lines: "49-140" }
    applicable_when: >
      TRC-ADOPTION-GATED: assumes a TrcAutoTask/TrcTaskMgr-shaped state-machine base exists,
      NOT merely DECODE conditions. A team WITHOUT TRC-shaped infra must TRANSLATE the idea
      (one reusable, param-object-driven auto-assist task shared between Auto and TeleOp via
      an inAuto flag) onto their own state-machine framework. Portable idea, framework-gated drop-in.
    source_team: "3543"
    confidence: medium-high
    depends_on: [3543-A-trcautotask]
    provenance:
      classification: independently-derived
      basis: "Season CONSUMER of Titan's own TrcAutoTask primitive (3543-A), not a re-invention. Single Titan lineage."
      collapses_with: []
    notes: >
      NOT INDEPENDENT ORCHESTRATION EVIDENCE: this is the season consumer of primitive
      3543-A; it is explicitly NOT a fourth leg of the orchestration-nonblocking finding
      (which requires three INDEPENDENTLY-DERIVED mechanisms — counting a consumer as a
      leg would undermine the very discipline that makes the finding trustworthy). The
      "extend TrcAutoTask + builder TaskParams" IDIOM is transferable; the State values +
      game logic (artifacts/motifs/goal AprilTags/spindexer exit slots) are DECODE-specific.
