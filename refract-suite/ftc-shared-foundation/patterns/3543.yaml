  - id: 3543-G-swerve-mecanum-drivebase
    layer: framework
    problem: >
      Support both mecanum and swerve drivetrains through one platform-independent
      kinematics/pose-tracking layer, including swerve module state and steering.
    solution_approach: >
      TrcDriveBase is the common base; TrcMecanumDrive and TrcSwerveDrive extend it.
      TrcSwerveModule models one corner as a drive motor + (mutually exclusive) steer
      MOTOR or steer SERVO, using a TrcWarpSpace(0..360) helper to optimize steering
      angle/direction. FtcSwerveBase adds a caller-supplied steer-power-compensation
      callback to counter drive-accel torque on the steer axis.
    code_reference: { file: "trclib/drivebase/TrcSwerveModule.java", lines: "31-67" }
    applicable_when: "drivetrain.type in {mecanum, swerve}"
    source_team: "3543"
    confidence: high
    provenance:
      classification: independently-derived
      basis: "Platform-independent trclib (trc492) shared across FRC+FTC; does NOT trace to any FTC quickstart. The unified DriveBase subsuming mecanum+swerve, plus steer-motor-OR-servo generality, is a distinctive in-house design."
      collapses_with: []
    maturity_note: "trclib maturity/adoption is team-quality/longevity corroboration, NOT design validation and NOT a promoter. HIGH is on single-source DESIGN MERIT (clean cross-drivetrain abstraction)."
    notes: "steerPowerCompConstant (Dashboard.java:64) is season/robot tuning (defaulted 0.0); only the framework kinematics abstraction + the steer-power-comp CALLBACK HOOK is core. First STANDALONE high in the corpus (design merit, not convergence)."

  - id: 3543-H-preferences-master-switches
    layer: framework
    problem: >
      Enable/disable individual subsystems/features at one config point so code for a
      not-yet-built/wired subsystem is safely skipped, and dashboard-heavy debug is
      compiled-in but off during competition.
    solution_approach: >
      RobotParams.Preferences is a class of `public static final boolean` master
      switches (useDriveBase/useIntake/useVision/…), consulted before constructing or
      updating each subsystem; updateDashboard is coupled to !inCompetition.
    code_reference: { file: "teamcode/RobotParams.java", lines: "36-87" }
    applicable_when: "architecture.hardware_config == compile_time_feature_flags"
    source_team: "3543"
    confidence: high
    provenance:
