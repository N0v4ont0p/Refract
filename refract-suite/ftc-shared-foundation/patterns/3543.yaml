patterns:
  - id: 3543-A-trcautotask
    layer: framework
    problem: >
      Run multi-step non-blocking auto-assist behaviors (aim-and-shoot, find-and-
      pickup) startable from TeleOp or Auto, acquiring exclusive control of several
      subsystems and cleanly cancelling/releasing them on preemption.
    solution_approach: >
      A generic abstract TrcAutoTask<T> wraps a TrcStateMachine<T> and registers
      as a periodic task with the cooperative TrcTaskMgr scheduler; subclasses
      implement acquireSubsystemsOwnership/releaseSubsystemsOwnership/stopSubsystems/
      runTaskState while the base handles start/cancel/completion signaling and
      enable/disable of the periodic hook uniformly.
    code_reference: { file: "trclib/robotcore/TrcAutoTask.java", lines: "29-246" }
    applicable_when: "software_stack.opmode_style == custom_cooperative_scheduler && autonomous.orchestration_style == task_state_machine"
    source_team: "3543"
    confidence: medium-high
    convergence_ref: orchestration-nonblocking   # see references/cross-team-findings.yaml
    provenance:
      classification: independently-derived
      basis: "Titan's own trclib (2022 copyright; TrcAutoTask split into the extracted lib 2024-05). Standalone weight = single Titan lineage."
      collapses_with: []
    maturity_note: "TRC is widely adopted (FTC+FRC) → MATURITY/POPULARITY only, NOT design validation (§12: adoption ≠ invention). Not promoted on adoption count."
    notes: >
      3rd leg of the orchestration-convergence finding (cross-team-findings.yaml).
      The medium-high applies to the CONVERGENCE CLAIM — its standalone code is
      single-source Titan lineage. Why it lifts the claim: TrcAutoTask is designed
      CROSS-PLATFORM (FRC too), where FTC's LinearOpMode platform-forcing (which
      capped the 18742 leg at medium-high) does NOT apply — so it is corroboration
      of a different kind, ruling out "the platform just forced it."

  - id: 3543-B-trcownershipmgr
    layer: framework
    problem: >
      Multiple concurrent callers (auto-tasks, driver control) may command the same
      subsystem, causing conflicting outputs; need single-owner-at-a-time guarantees
      and preemption handling.
    solution_approach: >
      A singleton TrcOwnershipMgr holds a HashMap<TrcExclusiveSubsystem, ownerID>
      with synchronized has/acquire/release; opt-in callers get exclusivity while
      unaware callers still operate (backward-compat). Underpins TrcAutoTask's
      acquire/release hooks.
    code_reference: { file: "trclib/robotcore/TrcOwnershipMgr.java", lines: "34-80" }
    applicable_when: "architecture.control == multiple_contending_control_sources"
    source_team: "3543"
    confidence: single-source
    provenance:
      classification: independently-derived
      basis: "Titan framework internal (2022 lineage); competition-hardened (a 2025-11 commit changed validateOwnership to log-not-throw 'to prevent crashing during competition' — first-party authorship)."
      collapses_with: []
    maturity_note: "Mature adopted library — maturity only, not design validation. No independent same-shape invention elsewhere in the corpus → single-source (legitimate, high-value)."
    notes: "High-value infra enabling preemptible exclusive subsystem control; season-agnostic."

  - id: 3543-C-trcsubsystem
    layer: framework
    problem: >
      Give OpModes a season-independent way to operate on "all subsystems" (cancel,
      zero-calibrate on startup, reset-to-safe, report status, sync dashboard params)
      without per-subsystem logic in the OpMode.
    solution_approach: >
      Abstract TrcSubsystem defines cancel/zeroCalibrate/resetState/updateStatus/
      updateParamsTo|FromDashboard; each instance self-registers into a static list in
      its constructor, enabling static fan-out (cancelAll, zeroCalibrateAll with
      completion aggregation, resetStateAll, updateStatusAll, params sync).
    code_reference: { file: "trclib/subsystem/TrcSubsystem.java", lines: "34-278" }
    applicable_when: "architecture.subsystem_lifecycle == uniform_contract_with_static_fanout"
    source_team: "3543"
    confidence: single-source
    provenance:
      classification: independently-derived
      basis: "Titan-authored 2025 generalization within the framework; a 2025-10 commit documents the FTC global-list-not-destroyed-on-reinit footgun — unambiguous first-party authorship."
      collapses_with: []
    maturity_note: "Part of the adopted TRC framework — maturity only. No cross-team independent invention → single-source, not promoted."
    notes: "Uniform-lifecycle + 'all subsystems' fan-out is a strong reusable design; season-agnostic."

  - id: 3543-D-drivebase-robottype
    layer: framework
    problem: >
      Keep developing autonomous/vision/drive code across a season transition (or
      before the competition robot is built) without coupling to one robot's wiring,
      and support both mecanum and swerve via the same season application code.
    solution_approach: >
      A DriveBase.RobotType enum (VisionOnly, DecodeRobot[mecanum, current],
      SwerveRobot, IntoTheDeepRobot[mecanum, PRIOR season]) selects — via
      RobotParams.Preferences.robotType — which FtcRobotBase.RobotInfo subclass
      (own PID coeffs, motor names, odometry/vision config) is built, and whether an
      FtcMecanumBase or FtcSwerveBase is constructed. Doc rationale (verbatim):
      "develop code on robots of previous seasons."
    code_reference: { file: "teamcode/subsystems/DriveBase.java", lines: "49-302" }
    applicable_when: "drivetrain.type in {mecanum, swerve} && season_transition_support == true"
    source_team: "3543"
    confidence: single-source
    provenance:
      classification: independently-derived
      basis: "Titan team-code applying its own framework's RobotInfo abstraction; IntoTheDeepRobot (prior season) coexisting with DecodeRobot = concrete cross-season carryover evidence."
      collapses_with: []
    maturity_note: "Mature framework's config-selection idiom — maturity only; no independent cross-team invention of this enum-driven selection observed."
    notes: >
      ★ The single most on-thesis pattern in the corpus for season-agnostic design.
      CORE = the SELECTION MECHANISM only. The concrete PID/motor constants in
      DecodeRobotInfo/SwerveRobotInfo/IntoTheDeepRobotInfo (e.g. driveMotorVelPidCoeffs,
      336.0*INCHES_PER_MM) are SEASON/ROBOT-SPECIFIC TUNING, not core-layer — several
      are commented out. Preserve verbatim.

  - id: 3543-E-ftcopmode
    layer: framework
    problem: >
      Provide cooperative multitasking over the stock LinearOpMode loop — separating
      main-thread periodic work from dedicated I/O threads, adding watchdog liveness
      monitoring, and giving subclasses robotInit/startMode/stopMode hooks.
    solution_approach: >
      FtcOpMode extends LinearOpMode implements TrcRobot.RobotMode; reflectively reads
      LinearOpMode's private runningNotifier, spawns/tracks the robot thread, registers
      a TrcWatchdogMgr.Watchdog (heartbeat gated on Thread.currentThread()==robotThread),
      and drives TrcTaskMgr's task types around robotInit/startMode/stopMode.
    code_reference: { file: "ftclib/robotcore/FtcOpMode.java", lines: "50-105" }
    applicable_when: "software_stack.opmode_style == custom_cooperative_scheduler && platform == FTC"
    source_team: "3543"
    confidence: single-source
    provenance:
      classification: independently-derived
      basis: "Titan FTC platform bridge (ftclib, 2024-06 lineage). The FTC counterpart to the framework's FRC bridge; single Titan lineage."
      collapses_with: []
    maturity_note: "Core of the adopted TRC-on-FTC stack — maturity only; not independently reinvented in the corpus."
    notes: >
      THREAD→TASKTYPE TOPOLOGY (traced in TrcTaskMgr.java, RESOLVED — record it so a
      future team does not build on a wrong assumption):
        - MAIN robot thread: START_TASK, STOP_TASK, PRE_PERIODIC_TASK, POST_PERIODIC_TASK.
        - ONE shared GLOBAL IO thread: INPUT_TASK AND OUTPUT_TASK both — despite the
          docs naming an "input thread" and "output thread", TrcTaskMgr.java:249-252
          states "There is only one global IO thread. All INPUT_TASKs and OUTPUT_TASKs
          run on this thread." Do NOT assume input and output run on separate threads.
        - OWN dedicated thread: each STANDALONE_TASK (for code that may block long).
      Timing-sensitive code depending on input/output concurrency must account for the
      SHARED IO thread. (runOpMode() body ~270-474 not line-by-line traced, but the
      TaskType→thread mapping above is confirmed from the enum docs + registration code.)

  - id: 3543-F-mechanism-templates
    layer: framework
    problem: >
      Reuse game-piece-agnostic building blocks (flywheel/turret shooter, roller
      intake, PID storage/indexer, servo claw, differential-servo wrist) instead of
      rewriting mechanism control each season.
    solution_approach: >
      trclib/subsystem template classes (TrcShooter, TrcRollerIntake, TrcPidStorage,
      TrcServoClaw, TrcDifferentialServoWrist) each implement TrcExclusiveSubsystem
      with auto-assist methods (e.g. TrcShooter aim-by-pan/tilt + spin-to-velocity +
      caller shoot callback + completion signaling), game-piece-agnostic. Season code
      composes/configures them with season params.
    code_reference: { file: "trclib/subsystem/TrcShooter.java", lines: "23-40" }
    applicable_when: "architecture.mechanism_library == reusable_template_classes"
    source_team: "3543"
    confidence: single-source
    provenance:
      classification: independently-derived
      basis: "Titan reusable mechanism library. TrcShooter carries a 2024 copyright (PREDATES 2025-26 DECODE) and a 2026-01 refactor generalizing TrcShootParam→TrcLookupTable 'to be not shooter specific' — literal cross-season carryover + active upkeep."
      collapses_with: []
    maturity_note: "Adopted framework, actively generalized — maturity/popularity only, not design validation."
    notes: "Season/game-piece-agnostic mechanism templates that season code composes = high framework value. 2024 copyright on TrcShooter = literal season-carryover evidence (verbatim). Single Titan lineage."

