patterns:
  - id: 19043-A-hardwarequeue
    problem: >
      Writing to many motors/servos every loop can blow the loop-time budget; schedule
      hardware WRITES so the most-needed device is serviced within a time budget.
    solution_approach: >
      A central HardwareQueue holds PriorityDevices; each loop it repeatedly picks the
      highest getPriority(timeRemaining) device and does ONLY that hardware write, until
      no device reports positive priority OR measured loop time exceeds targetLoopLength
      (0.016s). Priority = base + (staleness since last physical update) × (magnitude of
      pending change) — a staleness×urgency metric, explicitly NOT I2C bus arbitration.
    code_reference: { file: "utils/priority/HardwareQueue.java", lines: "35-64" }
    applicable_when: "software_stack.hardware_write_scheduling == custom && opmode_style == raw_linear_opmode && actuator_count_high"
    source_team: "19043"
    confidence: medium
    provenance:
      classification: undetermined
      basis: >
        VERIFIED as 19043's own multi-year iterated code (PriorityDevice base +
        getPriority(timeRemaining) + staleness×urgency), with MotorPriority as the
        VESTIGIAL V0 predecessor (0 live refs, same-commit birth). BUT it arrived on the
        2024-09-12 "initial transfers/first commit" (a season-to-season CARRY-FORWARD, not
        a from-scratch write), and the priority-hardware-queue ARCHITECTURE is a recognized
        shared FTC idiom, NOT a unique 19043 invention.
      lineage_unverified: >
        The provenance-checker associated the skeleton with an "Iron Reign / KookyBotz-style"
        priority-scheduler family from RECALL. A Rule-7 web search (3 queries, incl. the
        distinctive class names PriorityDevice/nPriorityServo) did NOT locate a specific
        published source to confirm OR refute that attribution. So the specific external
        lineage is UNVERIFIED — do NOT record Iron Reign/KookyBotz as fact. Classification
        remains undetermined: cannot confirm 19043-original OR external-derived.
      collapses_with: []
    notes: >
      If another corpus repo shows the same PriorityDevice/getPriority skeleton, treat it as
      a POSSIBLE shared-idiom collapse, not independent confirmation — revisit this lineage
      then. Season-agnostic. Medium (shared community idiom + unresolved provenance).

  - id: 19043-B-npriorityservo
    problem: >
      Apply the priority-write scheme to servos, whose motion is not instantaneous and
      whose "reached target" state has no hardware feedback.
    solution_approach: >
      nPriorityServo extends PriorityDevice and SIMULATES the servo's physical position
      over time via a per-ServoType enum (positionPerRadian + angular speed constants),
      advancing currentIntermediateTargetAngle toward targetAngle each getPriority() poll
      so priority + inPosition() stay accurate between hardware writes.
    code_reference: { file: "utils/priority/nPriorityServo.java", lines: "139-256" }
    applicable_when: "software_stack.hardware_write_scheduling == custom && actuator.type == servo"
    source_team: "19043"
    confidence: medium
    provenance:
      classification: independently-derived
      basis: "The servo physics-simulation layer on top of the (shared-idiom) PriorityDevice base is 19043's own bespoke, multi-year-iterated code; no external attribution/import."
      collapses_with: []
    notes: >
      VERBATIM developer caveats preserved: "// STUPID STUPID HACK I HATE YOU" (:187),
      "// Dawg what the hell??" (:239), "// Ong trust this function." (:244), the HITEC
      double-set workaround "I kid you not this must happen" (:170-174), AXON_MICRO
      "// TODO need to tune" (:22), and the known `first`-boolean issue (:45) "servos won't
      get set at the start if theyre set to 0". Self-assessed hacky/partly-untuned →
      medium. ServoType speed/position constants are hardware tuning, not asserted here.

  - id: 19043-C-ekf-localizer
    problem: >
      Fuse heterogeneous asynchronous localization sources (3-wheel odometry, Pinpoint,
      AprilTag vision) with different rates/noise/latency into one robust pose estimate.
    solution_approach: >
      nMergeLocalizer runs an EKF (RobotEKF): odometry deltas → predict each loop; Pinpoint
      → one update step (hard-reset vs soft-correct by a Mahalanobis-style distance);
      AprilTag → a second update whose innovation is computed against the TIME-INTERPOLATED
      PAST pose (findPastInterpolatedPose) so camera-pipeline latency isn't misread as a
      position jump.
    code_reference: { file: "subsystems/drive/localizers/nMergeLocalizer.java", lines: "78-215" }
    applicable_when: "sensing.odometry == goBILDA_pinpoint && vision.provides_pose == apriltag && localization.fusion == multi_sensor_ekf"
    source_team: "19043"
    confidence: medium
    provenance:
      classification: independently-derived
      basis: >
        EKF/Kalman is an ESTABLISHED technique (shared CONCEPT, not 19043-invented) — say so
        explicitly; do NOT credit convergence with other EKF teams as independent invention.
        The FTC IMPLEMENTATION is 19043's verified in-house V1→V2 evolution: MergeLocalizer V1
        (2025-11-29) → RobotEKF+nMergeLocalizer V2 (2026-03-15), with the latency-compensated
        past-pose innovation and hard-reset-vs-soft-correct branch custom.
      collapses_with: []
    notes: >
      LIVE localizer (feeds ROBOT_POSITION); MergeLocalizer is the retained-not-live V1
      (evolution evidence). Author-flagged interim: commit "now kalman filter exists,
      hopefully it works??" + a commented-out alternate Pinpoint-update block. Covariance
      constants (Q_*, pinpointResetDist, maxVisionErrorThresh) are season/robot tuning.
      Medium: novel-for-FTC integration but self-described unproven + tuning-dependent.

  - id: 19043-D-gvf-pathfollower
    problem: >
      Follow spline paths in autonomous with dynamic re-routing around obstacles, rather
      than committing to a rigid pre-planned trajectory.
    solution_approach: >
      A hand-rolled Guided Vector Field follower: per loop, sum a tangential traverse vector
      (from path velocity), a curvature-based lateral correction (traverse.mag²/radius ×
      correctScalar), and RepulsionPoint obstacle vectors into one move vector; fall back to
      a PID-to-point state once the segment is exhausted, with stuck-detection segment-skip.
    code_reference: { file: "subsystems/drive/Drivetrain.java", lines: "187-245" }
    applicable_when: "drivetrain.type == mecanum && software_stack.pathing == custom_gvf_spline_follower"
    source_team: "19043"
    confidence: medium
    provenance:
      classification: independently-derived
      basis: "GVF (Guided Vector Field) is an ESTABLISHED robotics technique — the CONCEPT is shared, NOT 19043-invented. The FTC IMPLEMENTATION is 19043's own hand-rolled code (verified custom pathing, no roadrunner/pedro import)."
      collapses_with: []
    notes: >
      VERBATIM: "// TODO: Tune these values" (correctScalar/rotScalar/decelThresh) and the
      self-assessed-interim stuck comment "Timeout / stuck protection (looks good? will check
      more in depth. consider switching to PID to point…". PID gains are tuning-dependent;
      author flags stuck-skip as not-fully-validated → medium. Season-agnostic pathing.

  - id: 19043-E-composition-root
    problem: >
      Keep OpModes thin and subsystems independently testable, avoiding a monolithic OpMode.
    solution_approach: >
      A central Robot owns one instance per subsystem + the shared HardwareQueue; a single
      update() sequences sensors → subsystem updates → hardwareQueue.update() (the actual
      hardware write-flush) → telemetry. OpModes issue reqX() calls, never touch hardware.
    code_reference: { file: "Robot.java", lines: "28-75" }
    applicable_when: "opmode_style == raw_linear_opmode && architecture.subsystem_separation == composition_root"
    source_team: "19043"
    confidence: medium
    provenance:
      classification: independently-derived
      basis: "19043's own code, but the composition-root idiom is NEAR-UNIVERSAL in FTC (cf 18742-A, 3543 Robot) — commodity-architecture convergence, NOT independent invention. Do NOT up-credit the cross-team agreement."
      collapses_with: []
    notes: "The distinctive/creditable part is the coupling to the priority HardwareQueue as the SINGLE write-flush point (Robot.java:72), not the composition root itself (commodity). Medium. Season-agnostic."

  - id: 19043-F-request-state-machine
    problem: >
      Sequence multi-step subsystem behaviors driven by async gamepad/auto requests without
      blocking the main loop.
    solution_approach: >
      Shooter/Intake each have an enum State + boolean reqX() flags consumed in a
      switch(state) in their own update(); transitions gate on readiness (turret.inPosition()
      && atVel() && hood.inPosition()), decoupling request timing from completion.
    code_reference: { file: "subsystems/shooter/Shooter.java", lines: "127-243" }
    applicable_when: "architecture.subsystem_control == request_flag_plus_readiness_gated_state_machine"
    source_team: "19043"
    confidence: medium
    provenance:
      classification: independently-derived
      basis: "19043's own code, but subsystem-level readiness-gated state machines are a NEAR-UNIVERSAL FTC idiom (same shape as 18742-D). Commodity convergence — explicitly NOT credited as independent invention."
      collapses_with: []
    notes: "Do NOT over-credit convergence with 18742-D or others — commodity FTC architecture. The request-flag + readiness-gate PATTERN is season-agnostic; AIMING/SHOOT content is season-specific. Medium."

