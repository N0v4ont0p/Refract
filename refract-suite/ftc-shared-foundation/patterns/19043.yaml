      distance-variable shooter, without solving closed-form ballistics at runtime.
    solution_approach: >
      ShotTable2: an outer TreeMap<distance, flywheelVel> plus, per breakpoint, an inner
      TreeMap<actual-flywheelVel, hoodAngle>, both linearly interpolated (tableLerp). No
      physics solved live. V1 ShotTable -> V2 ShotTable2 added the second axis conditioned
      on ACTUAL (not commanded) flywheel velocity.
