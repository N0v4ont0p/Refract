  - id: 19043-H-flywheel-control
    problem: >
      Hold flywheel velocity accurately across battery sag and a wide range, avoiding
      belt-slip at low speed.
    solution_approach: >
      PID on filtered velocity error + linear feedforward from an empirical velocity-vs-power
      sweep (hand-recorded in-comment "Tuned 2/25/26") + output scaled by
      flywheelScaleVoltage/currentBatteryVoltage (sag comp) + an asymmetric exponential filter
      (different smoothing above/below a velocity-jump threshold) + a max-accel clamp below a
      low-velocity threshold to avoid belt "skip" (velocityNoSkipThresh/NoSkipAccel).
    code_reference: { file: "subsystems/shooter/Flywheel.java", lines: "65-92" }
    applicable_when: "season.mechanism == flywheel_shooter && actuator.control_model == pidf_with_voltage_compensation"
    source_team: "19043"
    confidence: medium
    provenance:
      classification: independently-derived
      basis: "Self-authored (velocityNoSkip* constants unique to this file). The voltage-sag comp ECHOES 18742-F but that is a COMMON SHARED IDIOM (nominal-voltage scaling), NOT shared lineage — do NOT count 19043 as independent confirmation of the voltage-comp pattern. The distinctive contribution is the belt-skip max-accel clamp + asymmetric error-keyed filter."
      collapses_with: []
    notes: "Season-specific mechanism; transferable control idiom. Kept medium: velocity PID+FF and voltage scaling are individually commonplace; the value is the belt-skip-aware clamp."

  - id: 19043-I-turret-lead-prediction
    problem: >
      Compensate servo slew-rate lag when tracking a continuously moving target angle, rather
      than always commanding the instantaneous target and lagging behind.
    solution_approach: >
      Command the servo to a LEAD-predicted angle: targetAngle + (filtered targetAngleVel,
      clamped +/-150 deg/s) x loopTime x targetPredictNumLoops, so the servo chases a point
      ahead of the current aim solution.
    code_reference: { file: "subsystems/shooter/Turret.java", lines: "38-50" }
    applicable_when: "season.mechanism == turret && actuator.type == servo && target.motion == continuous_tracking"
    source_team: "19043"
    confidence: medium
    provenance:
      classification: independently-derived
      basis: "Self-authored (commit 'turret target predict ff'); standard lead/lookahead (derivative-of-target x dt) independently reinvented — trivial enough to be genuinely independent, distinctive enough (filtered target angular velocity, tunable prediction horizon in loop-counts) to be a real contribution."
      collapses_with: []
    notes: "Season-specific turret; transferable servo-lag-compensation technique. Medium (broadly-recognized control idiom, no cross-team replication in-batch to lift higher)."

  - id: 19043-J-balldetection-field-position
    problem: >
      Detect game-piece (artifact) presence and FIELD POSITION from a distance, to drive
      intake path-planning / auto-aim.
    solution_approach: >
      Limelight 3A neural-net detector (pipelineSwitch(7), getDetectorResults); area->distance
      via an empirical inverse-cube fit (d = 70 - 100*cbrt(ta - 0.005)); polar->cartesian into
      a FIELD-FRAME ball position using robot pose; field-bounds filter + a hand-tuned ranking
      heuristic (x-proximity + neighbor-clustering + first/last penalty) to pick a best ball.
    code_reference: { file: "vision/BallDetection.java", lines: "48-158", inverse_cube_fit: "77" }
    applicable_when: "vision.system == limelight_3a && vision.task == game_piece_field_localization"
    source_team: "19043"
    confidence: medium
    finding_ref: sensing-modality   # answers "WHERE on the field" (presence + 2D position)
    provenance:
      classification: independently-derived
      basis: "Self-authored inverse-cube area->distance fit + field-frame projection + ranking heuristic; stock Limelight3A SDK, no shared vision framework."
      collapses_with: []
    notes: >
      VERBATIM: "confidenceThresh = 0; // Todo - Tune" — the confidence filter is a live NO-OP
      (getConfidence()>0 always true); the field-bounds filter IS live. Sensing-modality:
      answers "WHERE are artifacts on the FIELD" (presence + 2D position). Season-specific
      target, but the Limelight-detector->field-position technique transfers.

  - id: 19043-K-analog-held-color
    problem: >
      Classify the COLOR/type of an artifact currently HELD in the intake (distinct from the
      field-position detection above).
    solution_approach: >
      A single AnalogInput light sensor, raw-voltage read, exponentially filtered, thresholded
      against two hardcoded cutoffs to classify held artifact green/purple/none; drives two
      indicator LEDs for driver feedback.
    code_reference: { file: "sensors/Sensors.java", lines: "130-142", thresholds: "133-134" }
    applicable_when: "sensing.held_piece_type == analog_light_sensor && season.artifact_has_color_variants == true"
