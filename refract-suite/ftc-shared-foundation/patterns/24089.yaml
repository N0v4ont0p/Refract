# believed twice to be something it is not. First as "24089 KEPT physics (proj_motion.py)
# — proof physics works" (Session-1 checkpoint / 15993-J note). Then as "physics attempted
# then abandoned — broken/offline/unintegrated." BOTH restated a prior conclusion without
# re-running the check against the FIELDED code. Re-verifying at source — Turret.java:148,
# where ProjectileMotion.calculate is called live, in the loop, driving flywheel/hood/azimuth
