  - id: 18742-G-logmanager
    problem: >
      Debug/telemetry needs per-module, per-severity filtering toggleable without
      recompiling or littering call sites with if-checks, while driving both
      Driver Station and FTC Dashboard.
    solution_approach: >
      A Telemetry wrapper fans addData/addLine to opMode.telemetry + a Dashboard
      TelemetryPacket (with field-overlay draw helpers: circle/polygon/rect in
      inch field coords), flushing per tick. On top, LogManager supports per-module
      named configs (Config(moduleName=…)) with a bitmask of debug levels and
      show/hide strategies (SHOW_SELECTED_LEVELS, SHOW_ABOVE_SELECTED_INCLUSIVE, …),
      so each subsystem has independently tunable verbosity.
    code_reference: { file: "utils/debug/LogManager.kt", lines: "1-179" }
    applicable_when: "telemetry.dashboard == ftc_dashboard && architecture.logging == leveled_per_module_log_config"
    source_team: "18742"
    confidence: single-source
    provenance:
      classification: independently-derived
      basis: "FTCLib=0; no shared observability framework; bespoke DebugSetting enum + bitmask levels fanning through the team's own Telemetry module. Git: authored in-repo (Gyro)."
      collapses_with: []
    notes: "STRONG observability signal (Phase 9 taxonomy positive) — genuinely-used, not token telemetry. Fully transferable, season-agnostic. Signal-quality ≠ provenance breadth → single-source."

  - id: 18742-H-gamepad-wake-start
    problem: >
      Let the driver "wake" the OpMode into RUNNING via controller input instead of
      the physical INIT/START buttons (e.g. re-run after a crash/reset).
    solution_approach: >
      In the pre-START loop, any gamepad1 activity (stick past deadband, trigger,
      bumper, specific buttons) calls
      OpModeManagerImpl.getOpModeManagerOfActivity(...).startActiveOpMode().
    code_reference: { file: "opModes/TeleOp.kt", lines: "17-25" }
    applicable_when: "software_stack.opmode_style == raw_linear_opmode"
    source_team: "18742"
    confidence: single-source
    provenance:
      classification: independently-derived
      basis: "FTCLib=0; small self-evident SDK trick using SDK internals only. Git: authored in-repo (tikho)."
      collapses_with: []
    notes: >
      CAVEATS (verbatim): (1) this is a LIGHTWEIGHT trick, NOT the elaborate
      resource-preserving "HotRun" system documented in architecture.md — HotRun's
      source is only on the Final-MultiThread branch, absent from master; do not
      conflate. (2) Relies on the INTERNAL SDK class OpModeManagerImpl — a real
      portability/fragility caveat (may break across SDK versions); a mild
      anti-pattern, flagged not endorsed.

  - id: 18742-I-auto-config-select-chain
    problem: >
      Give the drive team a pre-match, on-field way to pick a start position/strategy
      without reflashing, and auto-continue into TeleOp at match end.
    solution_approach: >
      Pre-START, gamepad bumper edge-transitions cycle a StartOrientation enum
      (each entry encodes start pose, basket/park poses, alliance color, and an
      odometry-cal pose), mirrored to DS + Dashboard. After the main loop ends, it
      calls OpModeManagerImpl(...).initOpMode(TeleOp::simpleName) to auto-queue TeleOp.
    code_reference: { file: "opModes/Auto.kt", lines: "16-83" }
    applicable_when: "software_stack.opmode_style == raw_linear_opmode"
    source_team: "18742"
    confidence: single-source
    provenance:
      classification: independently-derived
      basis: "FTCLib=0; the auto-chain-to-TeleOp via initOpMode is a distinctive integration choice, not a known template. Git: authored in-repo (tikho/tikhonsmovzh)."
      collapses_with: []
    notes: >
      CAVEATS (verbatim): (1) same INTERNAL-SDK OpModeManagerImpl reliance as
      18742-H (portability/fragility). (2) The bumper edge-detect is INLINED here
      (oldLeft/RightBumperState) instead of reusing 18742-J's listener registry — a
      minor internal inconsistency. Pre-START menu selection is a widespread idea;
      the specific pose-enum + init-chaining realization is one team's design.

  - id: 18742-J-gamepad-listener-registry
    problem: >
      Reuse gamepad edge/hold/analog handling across many subsystems without each
      re-implementing "old button state" bookkeeping.
    solution_approach: >
      An IGamepadListener interface with ClickGamepadListener (edge, tracks
      _oldState), HoldGamepadListener (level), AnalogGamepadListener (passthrough),
      registered via AddGamepad{1,2}ListenerEvent on the EventBus; attachGamepad
      updates all registered listeners once per tick, only in RunMode.MANUAL.
    code_reference: { file: "modules/Gamepad.kt", lines: "7-75" }
    applicable_when: "architecture.input_handling == listener_registry_via_event_bus && software_stack.opmode_style == raw_linear_opmode"
    source_team: "18742"
    confidence: medium
    provenance:
      classification: independently-derived
      cross_team_convergence: >
        15993 solves the same "reusable edge-detecting input" need via a String-keyed
        GamepadEx wrapper — a genuinely DIFFERENT mechanism (map/key lookup vs.
        lambda-supplier listener objects on an EventBus). Divergent mechanisms →
        independence. 15993 does NOT collapse into WoEN's design.
      environmental_temper: >
        Edge detection is a near-universal FTC COMMODITY need — this convergence
        rides a platform/commodity push, so per the standing rule (reserve high for
        convergence WITHOUT an environmental push) it is capped. Independence lifts it
        above single-source to medium; the commodity push blocks higher.
      collapses_with: []
    related:
      - { id: 15993-E-gamepadex, why: "same input-abstraction capability, different mechanism (string-keyed wrapper vs EventBus listener registry)" }
    notes: "Convergence is on the CAPABILITY (edge/hold/analog abstraction), not on the design. WoEN's EventBus-registered listener-object design remains single-team. Transferable, season-agnostic."

  - id: 18742-K-odometry-republish
    problem: >
      Provide field-relative pose+velocity for driver-relative TeleOp and closed-loop
      Auto from a dedicated odometry computer, not drivetrain encoders.
    solution_approach: >
      attachOdometry wraps GoBildaPinpointDriver, applies a fixed pod-offset +
      zeroing transform once at attach, and each tick republishes pose+velocity via
      a GetRobotOdometry request/response event over the EventBus. A dpad_down
      ClickGamepadListener re-zeros odometry to a known field pose mid-match.
    code_reference: { file: "modules/drivetrain/Odometry.kt", lines: "58-197" }
    applicable_when: "sensing.odometry == goBILDA_pinpoint && architecture.messaging == request_response_event_bus"
    source_team: "18742"
    confidence: single-source
    provenance:
      classification: independently-derived
      basis: "FTCLib=0; RoadRunner not used here (raw GoBildaPinpointDriver SDK). Git: 19 commits, heavily hand-iterated in-repo (tikho/tikhonsmovzh)."
      collapses_with: []
    notes: >
      TRANSFERABLE sub-pattern (season-agnostic): "wrap Pinpoint once with a fixed
      pod-offset/zeroing transform and republish pose+velocity on an event each tick."
      SEASON-SPECIFIC (verbatim flag): the SHOOT_SHORT_TRIANGLE / SHOOT_LONG_TRIANGLE
      point-in-triangle inside-shooting-zone booleans are DECODE-specific geometry —
      NOT transferable as-is. (velocity turn uses zeroingOrientation.angl — a possible
      field-name quirk, carried not evaluated.)

