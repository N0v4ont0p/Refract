patterns:
  - id: 18742-A-collector-attach-module
    problem: >
      Coupling OpMode control flow to hardware/subsystem logic yields monolithic
      God-OpMode classes hard to test or reuse across TeleOp/Auto.
    solution_approach: >
      A central Collector object holds shared state (hardwareMap, runMode,
      telemetry, battery, EventBus) plus four lifecycle multicast delegates
      (start/initUpdate/update/stop). Each subsystem is a free function
      attachX(collector) that reads hardware once, subscribes per-loop behavior
      into the lifecycle events, and exposes state only via EventBus. TeleOp.kt
      (45 lines) and Auto.kt (83 lines) are thin entry points.
    code_reference: { file: "collector/Collector.kt", lines: "28-84" }
    applicable_when: "software_stack.opmode_style == raw_linear_opmode && architecture.subsystem_pattern == module_attach_functions"
    source_team: "18742"
    confidence: single-source
    provenance:
      classification: independently-derived
      basis: "No FTCLib (0 imports); not a library Subsystem/Command pattern. Distinctive free-function attach idiom traces to no known quickstart/GM0 template."
      collapses_with: []
    notes: "Composition-over-inheritance subsystem convention; strong subsystem-separation signal (thin OpModes, no God-OpMode) per the failure-mode taxonomy lens."

  - id: 18742-B-eventbus
    problem: >
      Modules must query/notify each other's state without hard dependencies or
      import cycles.
    solution_approach: >
      A KClass-keyed EventBus: subscribe(eventClass, cb) registers per-type
      callbacks; invoke(eventInstance) dispatches to all subscribers and RETURNS
      the (possibly mutated) event object — used both fire-and-forget
      (SetDriveVelocityEvent) and as a mutable request/response query
      (GetRobotOdometry(): the event's own fields are the return channel).
    code_reference: { file: "utils/events/EventBus.kt", lines: "1-25" }
    applicable_when: "architecture.messaging == request_response_event_bus && software_stack.opmode_style == raw_linear_opmode"
    source_team: "18742"
    confidence: medium
    provenance:
      classification: independently-derived
      basis: "INTRA-TEAM lineage: master's synchronous EventBus is the single-threaded SUCCESSOR to the threaded ThreadedEventBus on Final-MultiThread (same team — one data point, two coats, not two independent inventions). KClass-reflection dispatch is custom; no external library ancestry."
      collapses_with: []
    notes: >
      THREAD-SAFETY CAVEAT (contingent, and NON-hypothetical for THIS team): the
      EventBus is a plain HashMap (hashMapOf) — NOT thread-safe. It is safe ONLY
      under master's current single-threaded contract, and that safety is
      contingent, not inherent. This is not a theoretical risk for 18742
      specifically: they have already run a fully multithreaded architecture once
      (preserved on Final-MultiThread, from which master descends), so any return
      to threading would turn this EventBus into a real data race. Team
      reputation/capability must not upgrade the pattern. Medium: sound within its
      single-threaded contract, but the thread-safety footgun is real and this is
      one team's design.

  - id: 18742-C-iaction-actionrunner
    problem: >
      Autonomous must interleave drive-to-point motion with mechanism actions,
      sequentially or in parallel, without blocking the single OpMode loop.
    solution_approach: >
      A cooperative IAction interface (start/update/isEnd/stop) polled once per
      tick by attachActionRunner, holding a FIFO ArrayDeque<IAction> and advancing
      only when the current action reports isEnd()==true; ParallelActions (AND/OR
      exit) and DriveAction compose behavior trees from small IActions, all
      non-blocking, routed through the EventBus.
    code_reference: { file: "modules/actions/ActionRunner.kt", lines: "39-249" }
    applicable_when: "software_stack.opmode_style == raw_linear_opmode && architecture.autonomous_orchestration == cooperative_action_queue"
    source_team: "18742"
    confidence: medium-high
    convergence_ref: orchestration-nonblocking   # see references/cross-team-findings.yaml (this is the platform-forced-capped FTC leg)
    provenance:
      classification: independently-derived
      cross_team_convergence: >
        THREE teams solve non-blocking orchestration via VISIBLY DIFFERENT,
        template-free mechanisms: 18742 `interface IAction`+EventBus, 15993
        `abstract class Task` state-machine (+ separate ActionQueue), 3543
        `extends TrcAutoTask<State>` (trc492's own framework). All FTCLib-free, no
        shared class names/template — genuinely independent implementations.
      environmental_temper: >
        HELD BACK FROM "high": the convergence is PARTLY PLATFORM-FORCED — all
        three lean on the LinearOpMode loop (72/13/58 files), and cooperative
        per-tick scheduling is what the FTC iterative model rewards. So this is
        convergence on a principle the platform pushes toward, not three teams
        independently cracking a non-obvious insight. Reserve "high" for
        convergence WITHOUT an environmental push toward one answer.
      collapses_with: []
    related:
      - { id: 15993-A-task-framework, why: "same orchestration principle, different mechanism (state machine)" }
      - { id: 15993-G-actionqueue, why: "15993's second, overlapping scheduler for the same problem" }
    notes: >
      Confidence (medium-high) is on the PRINCIPLE — cooperative per-tick
      step-functions over blocking sleeps — corroborated by divergent mechanisms
      across 3 independent teams, NOT vote-counting identical code. The specific
      EventBus-coupled IAction implementation itself is 18742's own; adopt the
      principle, not necessarily this wiring.

  - id: 18742-D-guarded-phase-state-machines
    problem: >
      Multi-step, hardware-timed scoring sequences must run in strict order, be
      interruptible-safe, and reject new commands while busy, without blocking.
    solution_approach: >
      An explicit named-phase enum state machine per concern (SortingPhase P1..P9,
      ShootingPhase P0..P6) advanced by a when(phase) dispatch called once per
      updateEvent tick, with transition guards on hardware-status helpers + elapsed
      time. An isStateMachineIdle() guard on every "try start X" entry point
      rejects overlapping commands (logged) rather than corrupting state.
    code_reference: { file: "scoringSystem/ScoringModulesConnector.kt", lines: "461-623" }
    applicable_when: "architecture.orchestration == guarded_enum_phase_state_machine"
    source_team: "18742"
    confidence: medium
    provenance:
      classification: independently-derived
      cross_team_convergence: "Same convergence family as 18742-C (15993/3543 reach guarded-phase machines by different routes). No shared code ancestry; no FTCLib."
      collapses_with: []
    notes: >
      The CONCRETE instance (ScoringModulesConnector:461-623) is SEASON-SPECIFIC
      (Decode sort/shoot) — preserved verbatim, does NOT transfer. Only the
      guarded-phase-machine PATTERN transfers. Medium (not higher): the guard idiom,
      though convergent, is a fairly generic engineering move — less distinctive
      than 18742-C's cooperative-scheduler convergence.

  - id: 18742-E-pid-segment-runner
    problem: >
      An on-robot autonomous path/point follower decoupled from PID tuning and
      reusable between TeleOp (driver-relative power) and Auto (field-relative
      regulated velocity).
    solution_approach: >
      A custom ITrajectorySegment (Move/Turn/Drive) queued via RunSegmentsEvent
      into attachRunner, which runs three independent PID Regulators (x, y,
      heading) against live odometry each tick and publishes SetDriveVelocityEvent
      consumed by attachDriveTrain (dual-mode: POWER for MANUAL, REGULATOR PID for
      AUTO, selected at attach-time).
    code_reference: { file: "modules/drivetrain/Runner.kt", lines: "39-239" }
    applicable_when: "drivetrain.type == custom_holonomic_mecanum && software_stack.pathing == custom_pid_segment_runner"
    source_team: "18742"
    confidence: single-source
    provenance:
      classification: independently-derived
      basis: "RoadRunner is BUILD-DEP-ONLY (imported in exactly 2 files: Vec2.kt for Vector2d, Regulator.kt for clamp — neither is the path runner). Deployed follower is the team's own segment-runner, not a quickstart MecanumDrive/TrajectorySequenceRunner."
      collapses_with: []
    notes: >
      VERBATIM CAVEAT: RoadRunner build-dep-only (Vector2d + clamp + offline
      MeepMeep viz), NOT the on-robot pathing. A per-segment PID follower vs a
      spline/motion-profiled follower is a real design trade-off — flag, not endorse.

  - id: 18742-F-pidf-regulator
    problem: >
      Apply battery-voltage compensation consistently across every subsystem's
      PID/feedforward output without each module re-reading/converting voltage.
    solution_approach: >
      A shared Regulator class: generic PIDF + gravity + static-gravity + power
      term (kP,kI,kD,kPow,kF,kG,kSG), integral reset-on-error-sign-change
      (err*_errOld<0), configurable output clamp, and voltage→power conversion via
      collector.battery. Every subsystem constructs its own Regulator from tunable
      RegulatorParameters but shares the voltage-comp math.
    code_reference: { file: "utils/regulator/Regulator.kt", lines: "9-79" }
    applicable_when: "architecture.control == shared_generic_pidf_regulator_class"
    source_team: "18742"
    confidence: single-source
    provenance:
      classification: independently-derived
      basis: "Only RoadRunner touchpoint is clamp() (build-dep-only). kG/kSG gravity + kPow squared-error + reset-I-on-sign-change are hand-written; not FTCLib's PIDFController, not a quickstart controller."
      collapses_with: []
    notes: >
      VERBATIM CAVEAT: voltage compensation only fires when the full
      update(err, target, battery) overload is called with LIVE battery voltage —
      update(err) defaults battery=12.0. A reader copying this must not assume
      automatic voltage-comp. Distinctive but unreplicated in-batch → single-source.

