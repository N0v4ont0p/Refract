deliberation_checkpoint:
  core_untouched_proof: >
    PROVEN: producing this draft required ZERO edits to core-feature-model.yaml and zero to §5/§8/
    §11/§12. Drivetrain stays the one always-core-fixed interface (§10); every BIOBUZZ mechanism
    interface will generate dynamically from this file's season_mechanisms keys, exactly as DECODE's
    do. The season-agnostic claim holds on a real second season.
  open_questions:
    - id: intake-transfer
      q: >
        Does the DECODE intake mechanism category transfer to Pollen, or does the ~40% smaller
        diameter (2.8-3.0 in vs 5.0 in) force a new category? Smaller, possibly-solid balls change
        compliance, spacing, and retention geometry. LEAN: do NOT assume transfer — size delta is
        the exact variable an intake is designed around. Needs: confirmed Pollen spec + field geometry.
    - id: is-there-a-launcher
      q: >
        Is BIOBUZZ even a launch/shooter game? Pollen being ball-shaped is suggestive but NOT
        dispositive (could be a place/deposit game). If there IS launching, the whole shooter-empirical-
        vs-physics + moving-shot-compensation corpus becomes relevant; if not, it doesn't. Do not
        pre-wire a shooter interface on a hunch. Needs: the manual's scoring definition.
    - id: pollen-count-per-cycle
      q: >
        How many Pollen per cycle / per possession limit? Drives whether a spindexer/magazine
        (cf. 22105 per-slot color sensing) is relevant or overkill. Needs: manual possession rules.
    - id: spec-uncertainty
      q: >
        The 2.8-3.0 in range must collapse to a single official number before any mechanism math.
        Treat the range as a Rule-7 open item, not an average — a shooter/intake tuned to 3.0 that
        meets a 2.8 element (or vice versa) is a real miss. Needs: official Team Manual Part 2.
  do_not_do_yet:
    - "Do NOT run §19 step 4 (quantitative strategy modeling) — no point values / time constraints exist."
    - "Do NOT add this slug to season-extensions/ACTIVE."
    - "Do NOT port DECODE archetypes or constraints_on_core as if confirmed for BIOBUZZ."
    - "Do NOT collapse the Pollen diameter range to a point estimate."
