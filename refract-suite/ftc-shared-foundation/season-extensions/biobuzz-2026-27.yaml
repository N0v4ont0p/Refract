# ----------------------------------------------------------------------------
# SCORING ELEMENT — the one thing preview material actually pins down (loosely).
# ----------------------------------------------------------------------------
scoring_element:
  name: Pollen
  form: plastic ball
  diameter_in:
    value: UNCONFIRMED
    reported_range: [2.8, 3.0]          # "roughly 2.8-3 in across different sources" — a RANGE, not a spec
    source_tier: 2                      # multiple pre-season sources disagree at the decimal; NOT official
    confidence: single-source-equivalent # "different sources" that may all trace to one preview image
    reverify_at: kickoff
  mass_g: UNKNOWN
  material_notes: "plastic; hollow-vs-solid UNKNOWN (matters for intake compliance + any launch)"
  cross_season_comparison:
    claim_in_plan: "PLAN.md §19 calls Pollen 'similar physical characteristics' to DECODE Artifacts"
    corpus_check: >
      FLAG (do not paper over): the DECODE Artifact is ~5.0 in diameter (corpus-verified —
      references/physics/decode-artifact-ballistics.json ball.diameter_in = 5.0, from team 24089's
      data). Pollen's reported 2.8-3.0 in is ~40% SMALLER in diameter. "Similar" may hold for
      material (plastic, ball-shaped) but is FALSE on the dimension that most drives intake/launch
      geometry. This directly feeds the deliberation checkpoint below — do NOT assume the DECODE
      intake/shooter mechanism category transfers on size grounds.

