//
// build.gradle in TeamCode
//
// Carried over from FTCLib-Quickstart nearly verbatim (see ../NOTICE.md) --
// this file assumes it lives inside a full FTC SDK / FTCLib-Quickstart
// checkout that supplies build.common.gradle, build.dependencies.gradle, and
// the FtcRobotController module. Drop this template's TeamCode/ contents into
// such a checkout; don't try to build this folder standalone.

apply from: '../build.common.gradle'
apply from: '../build.dependencies.gradle'

android {
    namespace = 'org.firstinspires.ftc.teamcode'

    packagingOptions {
        jniLibs.useLegacyPackaging true
    }
}

dependencies {
    implementation project(':FtcRobotController')
    annotationProcessor files('lib/OpModeAnnotationProcessor.jar')

    implementation 'org.ftclib.ftclib:core:2.1.1'   // command-based framework, subsystems, hardware wrappers
    implementation 'org.ftclib.ftclib:vision:2.1.0' // optional -- drop if this season's mechanisms don't need it

    implementation 'com.acmerobotics.dashboard:dashboard:0.4.10' // FTC Dashboard -- backs RobotTelemetry and @Config tunables
}
