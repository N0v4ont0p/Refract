# =============================================================================
# season-extensions/biobuzz-2026-27.yaml  —  REPLACEABLE season layer (LIVE, ACTIVE since 2026-09-13)
# =============================================================================
# Season Transition Protocol (§19): steps 1-3 DONE against the OFFICIAL manual.
#   Source: BIOBUZZ Competition Manual V1 + Team Update 00, both dated 2026-09-12, retrieved
#   2026-09-13 from ftc-resources.firstinspires.org (sha256 of cm.html + TU00 recorded in
#   corpus-staging/manual-biobuzz-2026-27/SOURCES.md). Rules corpus: tag_manual.py --season.
#
#   Step 6 sign-off given 2026-09-13 (taxonomy accepted as drafted; Q&A-dependent open questions stay
#   open below). transition_check.py passed before the flip.
#
# This replaces the pre-kickoff preview draft. What the preview got wrong, for the record:
#   - it knew one scoring element (Pollen); there are two (POLLEN + NECTAR)
#   - its 2.8-3.0 in "range" was an artifact; the manual gives one nominal 2.8 in (+ "may vary")
#   - scoring target / launcher / zones / endgame were UNKNOWN; all are now defined (below)
#
# Every value carries a manual citation. UNKNOWN = the manual text does not state it.
# FIGURE-ONLY = defined only in a figure/CAD the corpus does not store as text — treat as
# `ambiguous` (standing rule, ftc-rule-check), never resolve by guessing from prose.
# =============================================================================

_meta:
  slug: biobuzz-2026-27
  schema_version: 1                     # same schema as decode-2025-26.yaml — the slot is stable
  scope: season_specific
  status: live                          # manual-grounded; §19.5-6 signed off 2026-09-13
  replaced_by: season_transition_protocol

season: BIOBUZZ presented by RTX (FIRST CANOPY, 2026-2027)
game_name: BIOBUZZ
kickoff: 2026-09-12
rules_current_through: Team Update 00 (2026-09-12)   # Q&A opens 2026-09-28 (manual §1.7.4)

# ----------------------------------------------------------------------------
# SCORING ELEMENTS (§9.8, §10.3.1)
# ----------------------------------------------------------------------------
scoring_elements:
  POLLEN:
    diameter_in: 2.8          # "approximately 2.8 in. (7.1 cm)" §9.8
    material: "Gopher ResisDent polyethylene ball, yellow (am-5851_yellow)"
    count_per_match: 40       # §9.8
    staging: "4 in each of 4 FLOWERS, 4 in each GARDEN, 4 pre-loaded per ROBOT (§10.3.1)"
  NECTAR:
    diameter_in: 3.6          # "approximately 3.6 in. (9.1 cm)" §9.8
    material: "Gopher ResisDent polyethylene ball, red (am-5852_red) / blue (am-5852_blue)"
    count_per_match: {red: 8, blue: 8}
    staging: "3 in each upward-facing CELL of its color, 5 in each ALLIANCE AREA (§10.3.1)"
  tolerance: "not perfectly spherical and may vary in size — no numeric tolerance (§9.8)"

# ----------------------------------------------------------------------------
# FIELD FACTS that generated code / autonomous planning touches
# ----------------------------------------------------------------------------
field:
  size_in: [144, 144]                   # §9.2, 36 TILES
  cad_tolerance_in: 1.0                 # §9.1: official CAD, general tolerance +/- 1 in
  alliance_sides: {red: [A, B, C], blue: [D, E, F]}   # G304.A / G402 — column grid itself FIGURE-ONLY
  hive:
    pivot_axis_height_in: 43.95         # §9.6.1
    cell_opening_in: {width: 20, height: 14, depth: 12}   # §9.6.2; opening HEIGHT ABOVE TILES: FIGURE-ONLY
    tip_threshold:                      # manual §9.6 only says "until enough ... are LAUNCHED"
      source: "Event Field Setup Guide V1.0 §12.3 Calibration Requirements (official field doc, NOT a rule)"
      calibrated_to: "with 3 NECTAR in the CELL: 2nd POLLEN tossed = no tip, 3rd tossed = tip; empty CELL: 7th POLLEN tossed = no tip, 8th tossed = tip"
      caveat: "a calibration TARGET per field — setup guide says 3 POLLEN + 3 NECTAR has less mass than 8 POLLEN and fields vary; plan for margin, verify on the event field"
  flower:
    count: 4                            # §9.7; positions on perimeter FIGURE-ONLY
    top_opening_diameter_in: 4
    top_opening_height_in: 21.5
    retrieval_opening_in: {height: 3.55, depth: 3.57, width: UNKNOWN}
  loading_zone_in: {width: 23, depth: 11}   # §9.3
  garden_in: {length: 23, width: 2}         # §9.3
  tile_positions:                           # Event Field Setup Guide V1.0 §8.3-8.4 (official field doc, not rule text)
    loading_zone: {red: A5, blue: F2}
    garden: {red: A1, blue: F6}
    note: "tile LABELS are text; which way the A-F / 1-6 grid runs relative to the audience and alliance areas is defined only by the tile-grid figures (manual Fig 9-4/9-5) — read the figure before planning paths"
  apriltags:
    family: 36h11
    size_in: 3.25
    placement: "clusters of 4 on the BOTTOM of each CELL, facing DOWN toward the TILES (§9.9)"
    ids: {red_far_side: [30, 31, 32, 33], red_audience_side: [34, 35, 36, 37],
          blue_audience_side: [38, 39, 40, 41], blue_far_side: [42, 43, 44, 45]}
    note: "the HIVE flips on every TIP, so WHICH tags face the floor changes during a MATCH; no wall tags (§9.9)"
    sdk: "FTC SDK v12.0 (2026-09-12): tags are CLUSTERS; getCurrentGameTagLibrary() returns BIOBUZZ tags with each cluster origin at the center of the CELL opening"
    localization: "SDK v12.0 README: 'since BIOBUZZ AprilTags move, they are not suitable for absolute Field Localization' — DECODE-era AprilTag relocalization patterns do NOT transfer"

match:
  auto_s: 30
  transition_s: 8          # G403: no powered movement during transition
  teleop_s: 120
  endgame_period: none     # no period named ENDGAME; the last 60 s unlock NECTAR->FLOWER (G410) and all NECTAR entry (G426)

scoring:                   # Table 10-2 [[TABLE:10-2]]; RP thresholds Table 10-3 (non-premier events)
  leave: {auto: 3}
  park_loading_zone: {auto: 5, teleop: 5}
  hive_tip: {auto: 20, teleop: 20}          # LAUNCH into upward CELL is the only legal way (§10.5.1, G417)
  element_in_cell_at_end: {teleop: 2}
  bottom_nectar_bonus: {teleop: 5}
  element_in_owned_flower: {teleop: 2}
  element_in_garden: {teleop: 1}
  ranking_points: {win: 3, tie: 1, swarm: {threshold: "16 LEAVE+PARK points"},
                   pollinator_1: {threshold: "4 TIPS"}, pollinator_2: {threshold: "7 TIPS"}}
  fouls: {minor: 5, major: 20}              # Table 10-4

# ----------------------------------------------------------------------------
# SEASON MECHANISMS — taxonomy (signed off 2026-09-13), same list-shape as decode-2025-26.yaml so
# validate_config.py and the dynamic interface generation (§10) work unchanged.
# Each key exists because a rule makes it relevant; options are placeholders unless a rule names them.
# ----------------------------------------------------------------------------
season_mechanisms:
  intake: [roller, claw, other]                    # G407 note "active pickup/intaking"; R801 note: rollers are not airflow devices
  element_handling: [pollen_only, pollen_and_nectar]   # §9.8: POLLEN ~2.8 in, NECTAR ~3.6 in — two diameters; G408 no CONTROL of opponent NECTAR
  element_sorting: [none, passive, active]         # §9.8 two sizes / NECTAR red+blue; G407 max 4 CONTROLLED
  launcher: [flywheel, catapult, other, none]      # §10.5.1 + G417: LAUNCHING into an upward-facing CELL is the only way to TIP
  launcher_count: [1, 2]                           # no rule limits launcher count; R503 actuator budget (8 motors, 8 servos) applies
  turret: [none, single_axis, multi_axis]          # no rule basis either way — design choice
  flower_placement: [present, none]                # G418.A enter FLOWER from the top only; §10.5.2 + G410 FLOWER scoring in the last 60 s
  flower_retrieval: [present, none]                # G418.B remove POLLEN only, from the bottom only
  garden_herding: [present, none]                  # §10.5.3 GARDEN scoring; herding counts as CONTROL (§16, G407)
  endgame_parking: [loading_zone, none]            # §10.5.4 PARK = at least partially in the LOADING ZONE; scored, not mandatory
  # Deliberately absent: DECODE's gate_mechanism / classifier_interaction (no such terms in BIOBUZZ);
  # climb/hang (no scoring for it; G415 forbids suspending from ARENA elements).

code_tokens:
  # mechanism key -> identifier prefixes for config_lint.py. [] = behavior/logic with no reliable
  # class-name token (explicitly not lintable by name, rather than silently skipped).
  intake: [Intake]
  element_handling: []
  element_sorting: [Sorter]
  launcher: [Launcher, Shooter, Flywheel, Catapult]
  launcher_count: []
  turret: [Turret]
  flower_placement: [FlowerPlacer, FlowerDeposit]
  flower_retrieval: [FlowerRetriev, PollenRetriev]
  garden_herding: []
  endgame_parking: []

known_archetypes: []             # the manual defines none; do NOT port DECODE's turreted_shooter / fixed_shooter_on_swerve

constraints_on_core: []          # no rule constrains drivetrain type (R204 floor-grab and R801 vacuum bans are type-agnostic)

constraints_on_mechanisms:
  - if: {season_mechanisms.turret: {not: none}}
    requires: {season_mechanisms.launcher: {not: none}}
    reason: "a turret aims a launcher"

# ----------------------------------------------------------------------------
# CODE CONSTRAINTS — season rules that change what generated/reviewed CODE may do.
# Consumed by ftc-construct (generation) and ftc-code-review (review). Each is a rule, verified
# with rules.py lookup --season biobuzz-2026-27; re-verify after every Team Update.
# ----------------------------------------------------------------------------
code_constraints:
  - id: no-dashboard-streaming
    rule: R704
    text: "third party logging/streaming such as FTC Dashboard, FTControl Panels, and others are prohibited; no continuous video stream"
    applies_to: "competition builds — tuning tools stay usable in practice, but must be removable/disabled for events"
    detect: {pattern: 'FtcDashboard\.getInstance|MultipleTelemetry|TelemetryPacket|sendTelemetryPacket|com\.bylazar\.(telemetry|panels|fullpanels)|PanelsTelemetry'}
    detect_note: "targets streaming calls, not the @Config annotation (config exposure, not streaming); also disable the Dashboard server during matches per ftc-dashboard competition docs"
  - id: stationary-starting-configuration
    rule: R102
    text: "in the STARTING CONFIGURATION all parts of the ROBOT must be fully stationary"
    applies_to: "INIT — no pre-spinning flywheels/rollers before START"
  - id: no-transition-motion
    rule: G403
    text: "Any powered movement is not allowed during the transition period"
    applies_to: "AUTO end / TELEOP INIT — an OpMode INIT that moves actuators must not be pressed during the 8 s transition"
  - id: expansion-physically-limited
    rule: R105
    text: "18 x 24 x 29 in tall sizing volume; physically constrained without the use of software"
    applies_to: "software soft-limits do NOT satisfy the rule (DECODE allowed software vertical limits)"
  - id: nectar-flower-timer-gate
    rule: G410
    text: "may not enter NECTAR into the FLOWER scoring volume until the last 60 seconds"
    applies_to: "any automated NECTAR placement must be gated on match time (MAJOR FOUL per NECTAR)"
  - id: capacity-four
    rule: G407
    text: "may not simultaneously CONTROL more than 4 SCORING ELEMENTS"
    applies_to: "intake logic — count held elements; herding counts as CONTROL (§16)"
  - id: actuator-budget
    rule: R503
    text: "limited to a total of 8 motors and 8 servos"
    applies_to: "device_map — DECODE allowed 10 servos (TU00: servo max reduced to 8)"
  - id: auto-side
    rule: G402
    text: "may not disrupt AUTO for the opposing ALLIANCE; columns A-C red, D-F blue"
    applies_to: "autonomous paths — crossing is a MAJOR FOUL per MATCH even when not STRATEGIC"

  - id: sdk-12-apriltag-cluster-api
    rule: "FTC SDK v12.0 README, Breaking Changes (not a manual rule)"
    text: "AprilTag Cluster capability: the base AprilTagDetection type no longer has id / metadata / center (compile errors, verified 2026-09-13 by compiling SDK 11.1 samples against 12.0.0 libraries); ftcPose / robotPose still compile on the base type. Check instanceof AprilTagSingleDetection / AprilTagClusterDetection and cast before reading tag identity"
    applies_to: "any generated or reviewed vision code on SDK >= 12.0"
    detect: {pattern: '(?s)\bAprilTagDetection\b.*\.(id|metadata|center)\b', unless: 'AprilTagSingleDetection|AprilTagClusterDetection'}
  - id: no-apriltag-absolute-localization
    rule: "FTC SDK v12.0 README, Enhancements (not a manual rule)"
    text: "BIOBUZZ AprilTags move (they are on the tipping HIVE) and are not suitable for absolute Field Localization"
    applies_to: "do not generate AprilTag->field-pose relocalization for BIOBUZZ; targeting relative to a cluster is the supported use"
